[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rozkalns-weather"
version = "0.2.0"
description = "Private local weather forecast comparison and WeatherNext 3 verification service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
weathernext = [
  "google-cloud-bigquery>=3.36,<4",
]
weathernext-gcs = [
  "google-auth>=2.59.1,<3",
  "obstore>=0.11.1,<0.12",
  "requests>=2.34.2,<3",
  "xarray>=2026.9,<2027",
  "zarr>=3.4,<4",
]
test = [
  "playwright>=1.55,<2",
  "pytest>=8.4,<9",
]

[project.scripts]
rozkalns-weather = "rozkalns_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rozkalns_weather = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
