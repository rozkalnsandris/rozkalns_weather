name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest

  simple-deploy-contract:
    name: SIMPLE-DEPLOY consumer contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rozkalnsandris/ops-workflows
          ref: e05ed760791a127c7c9628696806ef39c9fe329c
          path: .simple-deploy-shared
          persist-credentials: false
      - run: >-
          python3 .simple-deploy-shared/scripts/validate_simple_deploy.py
          --manifest .simple-deploy.json
          --expected-repository rozkalnsandris/rozkalns_weather
