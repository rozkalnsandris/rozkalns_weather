name: Governance gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-repository-baseline:
    name: Public repository automation baseline
    uses: rozkalnsandris/ops-workflows/.github/workflows/public-repo-baseline.yml@e2fa7ecb1b1cdfab0711d8e3e147b5ae03a9a3f2
    with:
      forbid_self_hosted: true

  workflow-security:
    name: GitHub Actions static analysis
    uses: rozkalnsandris/ops-workflows/.github/workflows/workflow-security.yml@0450e662093c41e98ca96802b523ac91eb02e5fe
    permissions:
      contents: read

  local-contract:
    name: Simple Weather contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          python -m json.tool .github/start-mode-routing.json >/dev/null
          python -m json.tool .github/auto-run-full-v2.json >/dev/null
          python -m json.tool .simple-deploy.json >/dev/null
          grep -F 'simple private weather app' AGENTS.md >/dev/null
          grep -F 'SIMPLE-DEPLOY' AGENTS.md >/dev/null

  merge-gate:
    name: FAST-LANE Merge Gate
    runs-on: ubuntu-24.04
    needs: [public-repository-baseline, workflow-security, local-contract]
    if: ${{ always() }}
    steps:
      - name: Require governance checks
        env:
          PUBLIC_BASELINE: ${{ needs.public-repository-baseline.result }}
          WORKFLOW_SECURITY: ${{ needs.workflow-security.result }}
          LOCAL_CONTRACT: ${{ needs.local-contract.result }}
        run: |
          set -euo pipefail
          test "$PUBLIC_BASELINE" = success
          test "$WORKFLOW_SECURITY" = success
          test "$LOCAL_CONTRACT" = success
