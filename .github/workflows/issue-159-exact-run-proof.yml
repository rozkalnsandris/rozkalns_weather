name: Issue 159 exact-run public proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  exact-run-public-proof:
    if: github.head_ref == 'auto-full/159-fixed-exact-run-window'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Probe fixed candidate window
        run: >-
          python tools/probe_exact_run_window.py
          --start 2026-08-13
          --end 2026-08-26
          --truth-end 2026-09-10
          --delay-seconds 1.0
