services:
  weather:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${WEATHER_PORT:-9180}:8000"
    volumes:
      - weather_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  weather_data:
